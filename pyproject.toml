[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biomodel-monitor"
version = "0.3.0"
description = "Post-deployment monitoring and assurance platform for multimodal medical AI."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "BioModel Monitor contributors" }]
keywords = ["medical-ai", "monitoring", "drift", "calibration", "pathology"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "click>=8.1",
]

[project.optional-dependencies]
parquet = ["pyarrow>=14.0"]
dashboard = ["streamlit>=1.30"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.5",
    "mypy>=1.8",
    "pyarrow>=14.0",
]

[project.scripts]
biomodel-monitor = "biomodel_monitor.cli:main"

[tool.setuptools.packages.find]
include = ["biomodel_monitor*"]

[tool.setuptools.package-data]
"biomodel_monitor.reports" = ["templates/*.j2"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
